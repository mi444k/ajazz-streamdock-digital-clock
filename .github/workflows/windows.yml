name: Windows helper compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: com.weboff.digitalclock.sdPlugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Windows helper
        run: ./scripts/build-windows.ps1
      - name: Native engine tests
        run: ./tests/test-windows-native.ps1
      - name: Native read-only protocol checks
        run: node tests/windows-native-protocol-smoke.cjs
      - name: Windows browser visual checks
        run: node tests/windows-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-clock-windows-visuals
          path: com.weboff.digitalclock.sdPlugin/tests/render-output/*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Unit tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: digital-clock-windows-helper
          path: com.weboff.digitalclock.sdPlugin/native/calendar-app-helper.exe
          retention-days: 1
          if-no-files-found: error

