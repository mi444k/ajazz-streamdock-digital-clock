<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock settings</title>
  <link rel="stylesheet" href="style.css?v=0.2.0">
  <script defer src="inspector.js?v=0.2.0"></script>
</head>
<body>
  <main>
    <h1>Digital Clock</h1>
    <p>Choose any installed application to open with this key.</p>
    <label for="calendar-application">Application to open</label>
    <select id="calendar-application"><option value="apple-calendar">Apple Calendar (default)</option></select>
    <div class="actions">
      <button id="save-application" type="button" disabled>Save application</button>
      <button id="refresh-applications" class="secondary" type="button">Refresh list</button>
    </div>
    <output id="status" role="status" aria-live="polite">Loading installed applications…</output>
  </main>
</body>
</html>
